<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiz por Matérias PRO</title>

<style>
body{
  font-family: Arial, Helvetica, sans-serif;
  background:#eef2f7;
  padding:20px;
}
.container{
  background:white;
  padding:20px;
  border-radius:10px;
  max-width:700px;
  margin:auto;
  box-shadow:0 0 15px rgba(0,0,0,0.15);
}
button{
  padding:10px;
  margin:5px 0;
  width:100%;
  border:none;
  border-radius:5px;
  cursor:pointer;
  font-size:15px;
}
.options button:hover{opacity:0.9}
#nextBtn{background:#4CAF50;color:white;display:none}
#menuBtn{background:#2196F3;color:white}
#restartBtn{background:#f44336;color:white}
#timer{font-weight:bold;color:#d32f2f;text-align:center}
#progress{height:12px;background:#ddd;border-radius:8px;margin:10px 0;overflow:hidden}
#bar{height:12px;background:#4CAF50;width:0%}
</style>
</head>
<body>

<div class="container">
<h2>🎓 Quiz por Matérias PRO</h2>

<div id="menu">
<h3>Escolha a matéria:</h3>
<button onclick="startQuiz('geografia')">🌎 Geografia</button>
<button onclick="startQuiz('portugues')">📝 Português</button>
<button onclick="startQuiz('matematica')">🔢 Matemática</button>
<button onclick="startQuiz('historia')">📜 História</button>
<button onclick="startQuiz('ciencias')">🔬 Ciências</button>
<button onclick="startQuiz('ingles')">🇬🇧 Inglês</button>
<button onclick="startQuiz('informatica')">💻 Informática</button>
<button onclick="startQuiz('educacao')">⚽ Educação Física</button>
</div>

<div id="quiz" style="display:none">
<div id="timer"></div>
<div id="progress"><div id="bar"></div></div>
<div id="question"></div>
<div class="options" id="options"></div>
<div id="result"></div>
<button id="nextBtn" onclick="nextQuestion()">Próxima</button>
<button id="menuBtn" onclick="goMenu()">Voltar ao menu</button>
</div>

</div>

<script>
const timeLimit = 15;
let timerInterval;
let timeLeft;

const quizData = {
ingles:[
{pergunta:"O que significa 'Apple'?", alternativas:["Banana","Maçã","Uva","Pera"], correta:1},
{pergunta:"Tradução de 'Book'?", alternativas:["Livro","Caderno","Mesa","Caneta"], correta:0},
{pergunta:"'Dog' significa?", alternativas:["Gato","Cachorro","Pássaro","Peixe"], correta:1},
{pergunta:"Plural de 'Child'?", alternativas:["Childs","Children","Childes","Childer"], correta:1},
{pergunta:"'Blue' é qual cor?", alternativas:["Azul","Verde","Preto","Branco"], correta:0}
],
informatica:[
{pergunta:"O que é CPU?", alternativas:["Memória","Processador","Tela","Teclado"], correta:1},
{pergunta:"Qual é um sistema operacional?", alternativas:["Windows","Chrome","Word","Excel"], correta:0},
{pergunta:"O que é HTML?", alternativas:["Linguagem de marcação","Antivírus","Hardware","Navegador"], correta:0},
{pergunta:"Qual dispositivo move o cursor?", alternativas:["Mouse","Monitor","Gabinete","Impressora"], correta:0},
{pergunta:"O que é um pendrive?", alternativas:["Memória USB","Teclado","Cabo","Placa"], correta:0}
],
educacao:[
{pergunta:"Quantos jogadores tem um time de futebol?", alternativas:["9","10","11","12"], correta:2},
{pergunta:"Qual esporte usa cesta?", alternativas:["Futebol","Basquete","Vôlei","Tênis"], correta:1},
{pergunta:"Qual exercício trabalha pernas?", alternativas:["Agachamento","Flexão","Abdominal","Barra"], correta:0},
{pergunta:"O que melhora o condicionamento?", alternativas:["Sedentarismo","Exercício","Sono excessivo","TV"], correta:1},
{pergunta:"Qual esporte usa raquete?", alternativas:["Natação","Tênis","Futebol","Basquete"], correta:1}
]
};

// junta com matérias antigas se existirem
Object.assign(quizData, window.quizData||{});

let questions=[],current=0,score=0,subject="";

function startQuiz(sub){
subject=sub;
questions=[...quizData[sub]].sort(()=>Math.random()-0.5);
current=0;score=0;
document.getElementById("menu").style.display="none";
document.getElementById("quiz").style.display="block";
loadQuestion();
}

function loadQuestion(){
const q=questions[current];
document.getElementById("question").innerText=q.pergunta;
document.getElementById("options").innerHTML="";
document.getElementById("result").innerText="";
questions[current].alternativas.forEach((alt,i)=>{
let b=document.createElement("button");
b.innerText=alt;
b.onclick=()=>checkAnswer(i);
document.getElementById("options").appendChild(b);
});
updateProgress();
startTimer();
}

function startTimer(){
timeLeft=timeLimit;
document.getElementById("timer").innerText="⏱️ Tempo: "+timeLeft+"s";
timerInterval=setInterval(()=>{
timeLeft--;
document.getElementById("timer").innerText="⏱️ Tempo: "+timeLeft+"s";
if(timeLeft<=0){clearInterval(timerInterval);checkAnswer(-1);}
},1000);
}

function checkAnswer(i){
clearInterval(timerInterval);
let correct=questions[current].correta;
let res=document.getElementById("result");
if(i===correct){score++;res.innerText="✅ Correto!";}
else res.innerText="❌ Errado! Correta: "+questions[current].alternativas[correct];
[...document.getElementById("options").children].forEach((b,idx)=>{
b.disabled=true;
b.style.background= idx===correct?"#a8e6cf":"#ff8b94";
});
document.getElementById("nextBtn").style.display="block";
}

function nextQuestion(){
current++;
document.getElementById("nextBtn").style.display="none";
if(current<questions.length)loadQuestion();
else finishQuiz();
}

function finishQuiz(){
let percent=Math.round((score/questions.length)*100);
saveRanking(subject,percent);
document.getElementById("quiz").innerHTML=`
<h3>Você acertou ${score}/${questions.length} (${percent}%)</h3>
<h4>🏆 Melhor pontuação em ${subject}: ${getRanking(subject)}%</h4>
<button onclick="goMenu()">Voltar ao menu</button>`;
}

function updateProgress(){
document.getElementById("bar").style.width=((current/questions.length)*100)+"%";
}

function goMenu(){location.reload();}

function saveRanking(sub,percent){
let best=localStorage.getItem("rank_"+sub)||0;
if(percent>best)localStorage.setItem("rank_"+sub,percent);
}

function getRanking(sub){
return localStorage.getItem("rank_"+sub)||0;
}
</script>
</body>
</html>
