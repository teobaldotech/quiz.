<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiz por Matérias PRO</title>

<style>
body{font-family:Arial;background:#eef2f7;padding:20px}
.container{background:white;padding:20px;border-radius:10px;max-width:750px;margin:auto;box-shadow:0 0 15px rgba(0,0,0,.15)}
button{padding:10px;margin:5px 0;width:100%;border:none;border-radius:5px;cursor:pointer;font-size:15px}
.options button:hover{opacity:.9}
#nextBtn{background:#4CAF50;color:white;display:none}
#menuBtn{background:#2196F3;color:white}
#timer{font-weight:bold;color:#d32f2f;text-align:center}
#progress{height:12px;background:#ddd;border-radius:8px;margin:10px 0;overflow:hidden}
#bar{height:12px;background:#4CAF50;width:0%}
</style>
</head>
<body>

<div class="container">
<h2>🎓 Quiz por Matérias PRO</h2>

<div id="menu">
<h3>Escolha a matéria:</h3>
<button onclick="startQuiz('geral')">🌐 Modo Geral (Todas)</button>
<button onclick="startQuiz('geografia')">🌎 Geografia</button>
<button onclick="startQuiz('portugues')">📝 Português</button>
<button onclick="startQuiz('matematica')">🔢 Matemática</button>
<button onclick="startQuiz('historia')">📜 História</button>
<button onclick="startQuiz('ciencias')">🔬 Ciências</button>
<button onclick="startQuiz('ingles')">🇬🇧 Inglês</button>
<button onclick="startQuiz('informatica')">💻 Informática</button>
<button onclick="startQuiz('educacao')">⚽ Educação Física</button>
</div>

<div id="quiz" style="display:none">
<div id="timer"></div>
<div id="progress"><div id="bar"></div></div>
<div id="question"></div>
<div class="options" id="options"></div>
<div id="result"></div>
<button id="nextBtn" onclick="nextQuestion()">Próxima</button>
<button id="menuBtn" onclick="location.reload()">Voltar ao menu</button>
</div>
</div>

<script>
const timeLimit = 15;
let timerInterval, timeLeft;
let questions=[],current=0,score=0,subject="";

/* ===== BANCO COM IDs ===== */
const quizData = {
geografia:[
{id:1, pergunta:"Capital do Brasil?", alternativas:["Rio","Brasília","Salvador","SP"], correta:1},
{id:2, pergunta:"Maior continente?", alternativas:["África","Europa","Ásia","América"], correta:2}
],
portugues:[
{id:101, pergunta:"Plural de pão?", alternativas:["Pãos","Pães","Pãons","Pães"], correta:1}
],
matematica:[
{id:201, pergunta:"5+3?", alternativas:["7","8","9","10"], correta:1}
],
historia:[
{id:301, pergunta:"Descobridor do Brasil?", alternativas:["Cabral","Colombo","Vasco","Magalhães"], correta:0}
],
ciencias:[
{id:401, pergunta:"Planeta vermelho?", alternativas:["Marte","Terra","Júpiter","Vênus"], correta:0}
],
ingles:[
{id:501, pergunta:"House?", alternativas:["Casa","Carro","Mesa","Porta"], correta:0}
],
informatica:[
{id:601, pergunta:"CPU é?", alternativas:["Memória","Processador","Tela","Teclado"], correta:1}
],
educacao:[
{id:701, pergunta:"Jogadores no futebol?", alternativas:["9","10","11","12"], correta:2}
]
};

/* ===== ANTI REPETIÇÃO ===== */
function getUnusedQuestions(subject){
let usedIds = JSON.parse(localStorage.getItem("used_"+subject) || "[]");
let all = quizData[subject];
let unused = all.filter(q => !usedIds.includes(q.id));
if(unused.length===0){
  localStorage.removeItem("used_"+subject);
  unused = all;
}
return unused.sort(()=>Math.random()-0.5);
}

function markQuestionUsed(subject,id){
let usedIds = JSON.parse(localStorage.getItem("used_"+subject) || "[]");
usedIds.push(id);
localStorage.setItem("used_"+subject, JSON.stringify(usedIds));
}

/* ===== MODO GERAL ===== */
function getUnusedGeneral(){
let all=[];
Object.values(quizData).forEach(m=>all=all.concat(m));

let usedIds = JSON.parse(localStorage.getItem("used_geral") || "[]");
let unused = all.filter(q => !usedIds.includes(q.id));

if(unused.length===0){
  localStorage.removeItem("used_geral");
  unused=all;
}
return unused.sort(()=>Math.random()-0.5);
}

function markGeneralUsed(id){
let usedIds = JSON.parse(localStorage.getItem("used_geral") || "[]");
usedIds.push(id);
localStorage.setItem("used_geral", JSON.stringify(usedIds));
}

/* ===== QUIZ ===== */
function startQuiz(sub){
subject=sub;
questions = (sub==="geral") ? getUnusedGeneral() : getUnusedQuestions(sub);
current=0;score=0;
menu.style.display="none";
quiz.style.display="block";
loadQuestion();
}

function loadQuestion(){
const q=questions[current];
question.innerText=q.pergunta;
options.innerHTML="";
result.innerText="";
q.alternativas.forEach((alt,i)=>{
let b=document.createElement("button");
b.innerText=alt;
b.onclick=()=>checkAnswer(i);
options.appendChild(b);
});
updateProgress();
startTimer();
}

function startTimer(){
timeLeft=timeLimit;
timer.innerText="⏱️ Tempo: "+timeLeft+"s";
timerInterval=setInterval(()=>{
timeLeft--;
timer.innerText="⏱️ Tempo: "+timeLeft+"s";
if(timeLeft<=0){clearInterval(timerInterval);checkAnswer(-1);}
},1000);
}

function checkAnswer(i){
clearInterval(timerInterval);
let q=questions[current];

if(subject==="geral") markGeneralUsed(q.id);
else markQuestionUsed(subject, q.id);

let correct=q.correta;
result.innerText=(i===correct)?"✅ Correto!":"❌ Errado! Correta: "+q.alternativas[correct];

[...options.children].forEach((b,idx)=>{
b.disabled=true;
b.style.background= idx===correct?"#a8e6cf":"#ff8b94";
});

if(i===correct)score++;
nextBtn.style.display="block";
}

function nextQuestion(){
current++;
nextBtn.style.display="none";
if(current<questions.length)loadQuestion();
else finishQuiz();
}

function finishQuiz(){
let percent=Math.round((score/questions.length)*100);
let key = (subject==="geral") ? "rank_geral" : "rank_"+subject;
let best=localStorage.getItem(key)||0;
if(percent>best)localStorage.setItem(key,percent);

quiz.innerHTML=`<h3>Você acertou ${score}/${questions.length} (${percent}%)</h3>
<h4>🏆 Melhor pontuação: ${localStorage.getItem(key)}%</h4>
<button onclick="location.reload()">Voltar ao menu</button>`;
}

function updateProgress(){
bar.style.width=((current/questions.length)*100)+"%";
}
</script>
</body>
</html>
